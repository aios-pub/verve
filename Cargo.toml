[package]
name = "verve"
version = "0.8.0"
edition = "2024"
description = "Verve — an offline-first, one-stop developer workbench built with Rust."
publish = false
authors = ["Verve"]
# Community Edition is open-sourced under the GNU AGPL v3.0.
license = "AGPL-3.0"
homepage = "https://github.com/aios-pub/verve"

# macOS app bundle metadata (used by cargo-bundle).
[package.metadata.bundle]
name = "Verve"
identifier = "com.verve.app"
icon = ["assets/icons/verve.icns"]
version = "0.8.0"
resources = []
copyright = "Copyright (c) 2026 Verve. All rights reserved."
category = "Developer Tool"
short_description = "One-stop developer workbench"
long_description = """
Verve is an offline-first developer workbench built with Rust — unifying API
debugging, mock & capture, document sharing, hosts, and JSON tools in a single
native window."""

# macOS bundle settings
[package.metadata.bundle.osx]
frameworks = []
exception_domain = ""
minimum_system_version = "11.0"
# Use the dark mode-aware appearance.
style = "dark"

# Linux desktop entry metadata
[package.metadata.deb]
name = "verve"
maintainer = "Verve"
copyright = "2026, Verve"
depends = ["libssl3 | libssl1.1", "libc6 (>= 2.31)"]
section = "devel"
priority = "optional"
assets = [
    ["target/release/verve", "usr/bin/", "755"],
    ["assets/icons/verve.png", "usr/share/icons/hicolor/512x512/apps/verve.png", "644"],
    ["assets/verve.desktop", "usr/share/applications/verve.desktop", "644"],
]
extended-description = """
Verve is an offline-first developer workbench built with Rust — unifying API
debugging, mock & capture, document sharing, hosts, and JSON tools in a single
native window."""


# Windows installer metadata (cargo-wix / cargo-bundle)
[package.metadata.wix]
name = "Verve"
manufacturer = "Verve"
upgrade-guid = "12345678-1234-1234-1234-123456789012"
# No `license` field: WiX requires an RTF file for the EULA dialog, but the
# installer uses WixUI_FeatureTree (no license dialog), so the field is
# unnecessary. Pointing it at the plain-text LICENSE file made candle fail
# with exit code 9. AGPL-3.0 still ships in the LICENSE file alongside the
# binary and in the .zip artifact.
icon = "assets/icons/verve.ico"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# gpui-component is pulled from our fork (lijingrs/gpui-component) at the
# `verve-fork` branch. This fork locks gpui to the same rev as the direct
# dependency above (1d217ee) and adds two patches not yet in upstream:
#   - ListItem::on_drag/on_drop/on_drag_hover (drag-and-drop for list/tree rows)
#   - TreeState::ensure_visible/index_of (scroll-to-node)
# Upstream PRs: https://github.com/longbridge/gpui-component/pull/2553 (#2554)
# When those merge, switch back to the upstream repo.
gpui-component = { git = "https://github.com/lijingrs/gpui-component", rev = "0ea2ca91" }
gpui-component-assets = { git = "https://github.com/lijingrs/gpui-component", rev = "0ea2ca91" }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
futures = "0.3"
url = "2"
# Pure-Rust ECMAScript engine for pre/post-request scripts (PRD §5.2 `apt` API).
boa_engine = "0.20"

anyhow = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
# QR code generation for the document-sharing "二维码" share method (pure Rust).
qrcode = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
smol = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
rust-i18n = "=4.0.0"
# Pin to match rust-i18n 4.0.0's non-feature-gated try_load_locales API.
rust-i18n-support = "=4.0.0"

# WebSocket (real) + a dedicated tokio runtime for it.
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "process"] }
futures-util = "0.3"

# Pure-Rust git (gitoxide). Local ops + blocking network client (HTTPS via
# reqwest/rustls, reusing the project's TLS backend). Network calls run on a
# background executor so they never block the UI thread.
gix = { version = "0.69", default-features = false, features = [
    "worktree-mutation",
    "tree-editor",
    "status",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "credentials",
] }

# Semantic version comparison for the auto-update check.
semver = "1"
# Time-sortable, collision-resistant Base58 entity id (replaces uuid v4 for
# new records). Also exposed as the `{{$sparkid}}` dynamic request variable.
sparkid = "2.2.1"
# Embed Verve-specific Lucide SVG icons at compile time (composite AssetSource).
rust-embed = "8.7"
# --- `{{variable}}` auto-completion (LSP-style) ------------------------------
# Completion-item types for the variable auto-completion popover.
lsp-types = { version = "0.97.0", features = ["proposed"] }
# Rope text buffer for offset/position math in the completion engine.
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
# Native file dialogs (open/save) — response "save file to disk" flow.
rfd = "0.15"
# SSH client: russh (pure-Rust, no C deps) + terminal model + secure storage.
russh = "0.60"
russh-sftp = "2.3"
zmodem2 = "0.7"
alacritty_terminal = "0.24"
# Local PTY for the SSH panel's "local terminal" mode (spawn the user's shell
# in a pseudo-terminal, replacing the OS Terminal app). Unix: openpty via libc;
# Windows: ConPTY. No OpenSSL / native-tls in the dependency tree.
portable-pty = "0.9"
aes-gcm = "0.10"
zeroize = "1"
bincode = "1"
# Recursive directory walk (SFTP directory upload) and system locale detection.
walkdir = "2.5"
sys-locale = "0.3"
# MCP (Model Context Protocol) server SDK. Lets external AI clients (Claude
# Desktop, Cursor, Claude Code, VS Code Copilot, ...) manage the Verve API
# workspace over stdio; the client launches `verve mcp` as a subprocess.
# Default features provide server + #[tool] macros + schemars; `transport-io`
# adds the stdio transport (tokio stdin/stdout). rmcp 3.x uses schemars 1.x and
# tokio 1, matching the rest of the dependency tree.
rmcp = { version = "3.0", features = ["transport-io"] }
# JSON Schema generation for the MCP tool parameter types.
schemars = "1"
# Crypto provider bootstrap for the headless MCP CLI (no GUI init path).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints.clippy]
dbg_macro = "deny"
style = { level = "allow", priority = -1 }
module_inception = "allow"
# GPUI element-builder closures produce complex types; the project already
# allows the entire `style` group. These additional allows cover the remaining
# noisy lints that conflict with the GPUI/GPUI-component patterns.
type_complexity = "allow"
too_many_arguments = "allow"
result_large_err = "allow"

# rustc dead-code lints: the project has many roadmap features that produce
# unused-function/field warnings until wired up. Allow at the workspace level.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"

[dev-dependencies]

# Win32 bindings for the Windows ConPTY backend (ssh/win_conpty.rs). Direct
# dep so the feature set we need does not rely on feature unification from
# other crates in the tree.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "consoleapi",
    "wincontypes",
    "wincon",
    "processthreadsapi",
    "processenv",
    "winbase",
    "winnt",
    "handleapi",
    "synchapi",
] }

# gpui is patched via our fork (amosgeek/zed). The `verve-force-csd` branch is
# 1d217ee (the rev pinned above) plus one commit, "gpui_linux(x11): require
# only a compositor for client-side decorations" (a50e7d671f):
#   - deepin's kwin never lists _GTK_FRAME_EXTENTS in _NET_SUPPORTED, so
#     gpui's X11 probe downgraded WindowDecorations::Client to Server and the
#     WM stacked its own title bar ("Verve") on top of the app's drawn title
#     bar. CSD works fine there (Motif undecorated hint + app-drawn
#     shadow/resize), so the probe now only requires a compositor.
# All four crates below must point at the same fork rev: they share one
# source tree, and patching only some of them would pull two copies of the
# zed workspace into the graph.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/amosgeek/zed", rev = "a50e7d671fafd357774846f64693443e0b267ea7" }
gpui_platform = { git = "https://github.com/amosgeek/zed", rev = "a50e7d671fafd357774846f64693443e0b267ea7" }
reqwest_client = { git = "https://github.com/amosgeek/zed", rev = "a50e7d671fafd357774846f64693443e0b267ea7" }
http_client = { git = "https://github.com/amosgeek/zed", rev = "a50e7d671fafd357774846f64693443e0b267ea7" }
