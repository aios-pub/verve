[package]
name = "verve"
version = "0.3.0"
edition = "2024"
description = "Verve — an offline-first, one-stop developer workbench built with Rust."
publish = false
authors = ["Verve"]
# Community Edition is open-sourced under the GNU AGPL v3.0.
license = "AGPL-3.0"
homepage = "https://github.com/lijingrs/verve"

# macOS app bundle metadata (used by cargo-bundle).
[package.metadata.bundle]
name = "Verve"
identifier = "com.verve.app"
icon = ["assets/icons/verve.icns"]
version = "0.3.0"
resources = []
copyright = "Copyright (c) 2026 Verve. All rights reserved."
category = "Developer Tool"
short_description = "One-stop developer workbench"
long_description = """
Verve is an offline-first, one-stop developer workbench built with Rust —
unifying API debugging, SSH triage, Docker/K8s log inspection, stress testing,
mock & capture, notes, hosts, and JSON tools in a single native window."""

# macOS bundle settings
[package.metadata.bundle.osx]
frameworks = []
exception_domain = ""
minimum_system_version = "11.0"
# Use the dark mode-aware appearance.
style = "dark"

# Linux desktop entry metadata
[package.metadata.deb]
name = "verve"
maintainer = "Verve"
copyright = "2026, Verve"
depends = ["libssl3 | libssl1.1", "libc6 (>= 2.31)"]
section = "devel"
priority = "optional"
# Ship the bundled libpdfium.so under /usr/lib/verve/; a wrapper script at
# /usr/bin/verve sets LD_LIBRARY_PATH before exec-ing the real binary so that
# the $ORIGIN rpath baked into the binary is not the only search path.
assets = [
    ["target/release/verve", "usr/lib/verve/", "755"],
    ["target/release/libpdfium.so", "usr/lib/verve/", "644"],
    ["assets/icons/verve.png", "usr/share/icons/hicolor/512x512/apps/verve.png", "644"],
    ["assets/verve.desktop", "usr/share/applications/verve.desktop", "644"],
]
extended-description = """
Verve is an offline-first, one-stop developer workbench built with Rust —
unifying API debugging, SSH triage, Docker/K8s log inspection, stress testing,
mock & capture, notes, hosts, and JSON tools in a single native window."""


# Windows installer metadata (cargo-wix / cargo-bundle)
[package.metadata.wix]
name = "Verve"
manufacturer = "Verve"
upgrade-guid = "12345678-1234-1234-1234-123456789012"
# No `license` field: WiX requires an RTF file for the EULA dialog, but the
# installer uses WixUI_FeatureTree (no license dialog), so the field is
# unnecessary. Pointing it at the plain-text LICENSE file made candle fail
# with exit code 9. AGPL-3.0 still ships in the LICENSE file alongside the
# binary and in the .zip artifact.
icon = "assets/icons/verve.ico"

# Standalone document-sharing server binary for cloud/headless deployment.
[[bin]]
name = "verve-server"
path = "src/bin/verve_server.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# gpui-component is pulled from our fork (lijingrs/gpui-component) at the
# `verve-fork` branch. This fork locks gpui to the same rev as the direct
# dependency above (1d217ee) and adds two patches not yet in upstream:
#   - ListItem::on_drag/on_drop/on_drag_hover (drag-and-drop for list/tree rows)
#   - TreeState::ensure_visible/index_of (scroll-to-node)
# Upstream PRs: https://github.com/longbridge/gpui-component/pull/2553 (#2554)
# When those merge, switch back to the upstream repo.
gpui-component = { git = "https://github.com/lijingrs/gpui-component", rev = "7268e295" }
gpui-component-assets = { git = "https://github.com/lijingrs/gpui-component", rev = "7268e295" }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
futures = "0.3"
url = "2"
# http types (Uri) for the kube K8s client Config.
http = "1"
# secrecy 0.10 is required by the kube crate's AuthInfo secret fields (token,
# password, client key). The project's own `secrecy = "0.8"` is used elsewhere
# (SSH), so alias the newer version to avoid a conflict.
secrecy_010 = { package = "secrecy", version = "0.10" }
# PEM parsing to convert a kubeconfig's base64 CA data into the DER bytes that
# the kube client's `Config::root_cert` expects.
pem = "3.0"
# rustls is used by several TLS consumers (kube, reqwest, russh). rustls 0.23
# needs an explicit crypto provider; both `ring` and `aws-lc-rs` end up compiled
# (ring via HTTP, aws-lc-rs via russh), so we must install one default at startup
# to avoid the auto-detection panic. `ring` matches the HTTP TLS stack.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
boa_engine = "0.20"

anyhow = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
# Recursive directory walker for the relocate module's directory-size scan +
# cancel-aware recursive copy.
walkdir = "2.5"
# Optional SHA-256 integrity verification for migrated directories.
sha2 = "0.10"
# QR code generation for the document-sharing "二维码" share method (pure Rust).
qrcode = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
smol = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
rust-i18n = "=4.0.0"
# Pin to match rust-i18n 4.0.0's non-feature-gated try_load_locales API.
rust-i18n-support = "=4.0.0"

# WebSocket (real) + a dedicated tokio runtime for it.
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "process"] }
futures-util = "0.3"

# Pure-Rust git (gitoxide). Local ops + blocking network client (HTTPS via
# reqwest/rustls, reusing the project's TLS backend). Network calls run on a
# background executor so they never block the UI thread.
gix = { version = "0.69", default-features = false, features = [
    "worktree-mutation",
    "tree-editor",
    "status",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "credentials",
] }

# SSH client: russh (pure-Rust, no C deps) + terminal model + secure storage.
russh = "0.60"
russh-sftp = "2.3"
zmodem2 = "0.7"
alacritty_terminal = "0.24"
aes-gcm = "0.10"
zeroize = "1"
secrecy = "0.8"
bincode = "1"
# Native file open/save dialogs for SFTP upload/download (cross-platform, async-safe).
rfd = "0.15"
# Markdown → PDF export for the Notes / Markdown panels. Backed by Typst, which
# embeds fonts correctly (CFF + glyf) and subsets automatically. `default-features
# = false` drops the CLI deps (clap/reqwest/notify/atty); we use the lib only.
# CJK glyphs render via the OS-installed system fonts (macOS PingFang, Windows
# YaHei, Linux Noto CJK); see `notes_pdf.rs`.
mdxport = { version = "0.3", default-features = false }
# PDF rendering via Pdfium (bundled native library, extracted at build time)
pdfium-render = "0.8"
# Pixel-buffer / image types for handing rendered PDF pages to GPUI.
image = "0.25"
# Semantic version comparison for the auto-update check.
semver = "1"
# Embed Verve-specific Lucide SVG icons at compile time (composite AssetSource).
rust-embed = "8.7"
# oha load testing library (integrated directly, no external binary needed)
oha = { version = "1.15.0", default-features = false, features = ["rustls"] }
clap = { version = "4", features = ["derive"] }
# Kubernetes client (kube-rs). Native HTTP/WS client to the API server,
# replacing subprocess calls to the external `kubectl` binary (which GUI apps
# often can't find on PATH). `ws` enables exec/port-forward over WebSocket.
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
# Docker client (bollard). Native HTTP/unix-socket client to the Docker Engine
# API, replacing subprocess calls to the external `docker` binary. `ssl` enables
# rustls 0.23 HTTPS (matches the project's rustls/ring backend). `pipe` keeps
# Windows named-pipe support for cross-platform parity.
bollard = { version = "0.21", default-features = false, features = ["http", "pipe", "ssl"] }

# Markdown parser (CommonMark compliant) for the notepad live preview.
pulldown-cmark = "0.12"
# Spec-compliant HTML5 parser (servo's). Used to parse raw-HTML blocks in the
# WYSIWYG editor so README-style wrappers (with Markdown text like "<1 秒",
# "<100MB", "> quote" mixed into HTML) classify correctly. The hand-written
# tokenizer mis-tokenizes a `<` followed by a digit/space as a tag start,
# which is text per the HTML5 spec (tag names must start with an ASCII letter).
html5ever = "0.27"
markup5ever_rcdom = "0.3"

# --- WYSIWYG markdown editor (ported from velotype) -------------------------
# CSS color parsing for inline HTML style attributes (e.g. <span style="color:#f00">).
cssparser = "0.37"
# Grapheme/segmentation for correct caret movement in the block text editor.
unicode-segmentation = "1.13"
# base64 decoding for inline HTML data: URLs and embedded images.
base64 = "0.22"
# HTML structure validation via tree-sitter (gates semantic HTML rendering vs raw fallback).
tree-sitter = { version = "0.26", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
# LaTeX math rendering for $$...$$ and $...$ blocks.
ratex-layout = "0.1.9"
ratex-parser = "0.1.9"
ratex-svg = { version = "0.1.9", features = ["embed-fonts", "standalone"] }
# Mermaid diagram rendering.
mermaid-rs-renderer = { version = "0.3.0", default-features = false }
# Tree-sitter grammar crates for code-block syntax highlighting.
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
# TOML grammar; published under the `adot-tree-sitter-toml` package name but
# exposed as the `tree_sitter_toml` crate (matches velotype).
tree-sitter-toml = { package = "adot-tree-sitter-toml", version = "0.1", optional = true }
tree-sitter-highlight = { version = "0.26", optional = true }
# `toml` is needed by config::preferences once the settings layer is ported.
toml = "1"
# JSON Schema generation for GPUI action types (SelectTheme/SelectLanguage/...).
schemars = "1"
# `sys-locale` to detect the OS locale for wysiwyg i18n.
sys-locale = "0.3"
# `notify` cross-platform filesystem watcher for the Markdown panel: detects
# when an open `.md` file is modified by an external program so the editor can
# auto-reload (clean buffer) or prompt to reload (dirty buffer).
notify = "7.0"
sparkid = "2.2.1"

[features]
default = ["wysiwyg-render", "code-highlight-core", "code-highlight-official", "code-highlight-config"]
# WYSIWYG block runtime + rendering layer (stage 2+). The pure-logic markdown
# models in stage 1 compile without it; once the block runtime is wired up the
# feature is always on.
wysiwyg-render = []
# velotype's gpui `test-support`-based integration tests (block/editor). Off
# by default; enabling it pulls in gpui's `test-support` feature, which exposes
# `TestAppContext` / `VisualTestContext` and the `#[gpui::test]` harness.
wysiwyg-gpui-tests = ["gpui/test-support"]
# Multi-window / app-menu integration tests in `editor/tests.rs` that need the
# `app_menu::open_editor_window` / `dispatch_menu_action` helpers. Those live in
# the `ui` app layer (wysiwyg can't reach up to it), so the tests are not yet
# portable; off by default until the window-management porting (stage 5) lands.
wysiwyg-window-tests = []
code-highlight-core = ["dep:tree-sitter", "dep:tree-sitter-highlight"]
code-highlight-official = [
    "code-highlight-core",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-md",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-css",
    "dep:tree-sitter-go",
    "dep:tree-sitter-html",
    "dep:tree-sitter-java",
    "dep:tree-sitter-php",
    "dep:tree-sitter-python",
    "dep:tree-sitter-ruby",
]
code-highlight-config = [
    "code-highlight-core",
    "dep:tree-sitter-yaml",
    "dep:tree-sitter-toml",
]

[lints.clippy]
dbg_macro = "deny"
style = { level = "allow", priority = -1 }
module_inception = "allow"
# GPUI element-builder closures produce complex types; the project already
# allows the entire `style` group. These additional allows cover the remaining
# noisy lints that conflict with the GPUI/GPUI-component patterns.
type_complexity = "allow"
too_many_arguments = "allow"
result_large_err = "allow"
# The WYSIWYG editor (ported from velotype) uses these patterns intentionally;
# mirroring velotype's own lint allows keeps the port diff-clean.
manual_div_ceil = "allow"
manual_checked_ops = "allow"
manual_clamp = "allow"
let_underscore_future = "allow"
map_identity = "allow"

# rustc dead-code lints: the project has many roadmap features that produce
# unused-function/field warnings until wired up. Allow at the workspace level.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"

[dev-dependencies]
