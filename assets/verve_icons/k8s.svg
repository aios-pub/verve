<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Kubernetes wheel: outer heptagon approximated by a circle with spokes -->
  <circle cx="12" cy="12" r="8"/>
  <!-- Inner hub -->
  <circle cx="12" cy="12" r="2"/>
  <!-- 7 spokes radiating from center -->
  <line x1="12" y1="4" x2="12" y2="10"/>
  <line x1="12" y1="14" x2="12" y2="20"/>
  <line x1="4.5" y1="8" x2="10" y2="10.5"/>
  <line x1="14" y1="13.5" x2="19.5" y2="16"/>
  <line x1="4.5" y1="16" x2="10" y2="13.5"/>
  <line x1="14" y1="10.5" x2="19.5" y2="8"/>
  <!-- Notches on the rim (approximate) -->
  <path d="M9.5 5 L10 6"/>
  <path d="M14.5 5 L14 6"/>
  <path d="M4.5 12 L5.5 12"/>
  <path d="M18.5 12 L19.5 12"/>
</svg>
