help:
  title: "Help Center"
  open_hint: "Help Center"
  search_ph: "Search features or shortcuts…"
  nav_start: "Getting Started"
  nav_features: "Feature Guide"
  nav_shortcuts: "Shortcuts"
  nav_about: "About"
  search_results: "Search Results"
  no_results: "No matches — try another keyword"
  start_t1: "What is Verve"
  start_p1: "Verve is an offline-first developer workbench: API debugging, SSH, Markdown & notes, JSON formatting, stress testing, traffic capture and more in one app. All data stays in the local ~/.verve directory — no account, no cloud."
  start_t2: "Switching views"
  start_p2: "The left activity rail switches views (click or drag to reorder); the common views have fixed shortcuts: ⌘1 API, ⌘2 SSH, ⌘3 JSON, ⌘4 Notes, ⌘5 Markdown (Ctrl+1..5 on Windows/Linux). Inside a Markdown / Notes editing block those number keys act as heading/paragraph formatting first; press Esc to leave the block and restore view switching."
  start_t3: "The editor"
  start_p3: "Notes and the Markdown editor share the same WYSIWYG engine: edit the rendered document directly — headings, lists, tables, code blocks, images — or switch to source mode. See the Shortcuts section for every key."
  start_t4: "Environment variables"
  start_p4: "Reference environment / global variables with {{key}} placeholders in request URLs, headers and bodies; switch environments from the top bar and manage them in Settings → Environments. Renaming a key auto-syncs its placeholders."
  start_t5: "Data & sync"
  start_p5: "Workspace data is auto-saved as a local git repository (interval configurable in Settings) with full history."
  start_t6: "Customization"
  start_p6: "Open settings from the ⚙ at the bottom-left: UI language, theme, home view, hidden rail items, editor shortcut customization and more."
  view_desc_intro: "Every feature view in the app (matching the left activity rail):"
  view_desc:
    api: "API management & debugging: project/folder/request tree, request building (params, headers, body, auth), response viewer with saved examples, cURL import/export, environment substitution."
    history: "Browse request history and responses on a timeline; replay past requests."
    mock: "Mock service: configure mock rules for endpoints and serve them locally for frontend integration."
    projectmanage: "Project management: Git status, staging & commits, history and branches (gix-backed)."
    share: "Document sharing: publish local documents as online share links and manage the share configs."
    autotest: "Automated testing: compose suites/cases/steps, run them in one click and review the report."
    stress: "Stress testing: graphically configure concurrency, duration and more, with live result charts."
    proxy: "HTTP proxy: capture local request traffic for inspection and debugging."
    k8s: "Kubernetes management: browse cluster resources, pod logs and terminals."
    docker: "Docker management: container/image lists, logs, terminals and common operations."
    ssh: "SSH management: host cards for connection info, multi-tab terminal sessions, SFTP file browsing and transfer."
    hosts: "Hosts editor: manage hosts entries in profiles and apply them to the system /etc/hosts or as in-app virtual overrides."
    notes: "Notepad: lightweight Markdown notes (WYSIWYG) with autosave, search and a note tree. While a block is focused, ⌘1..⌘6 / ⌘0 act as heading/paragraph formatting; press Esc to leave the block and restore global view switching."
    markdowneditor: "Markdown editor: open .md files in tabs, WYSIWYG editing, source mode, find & replace, PDF export. While a block is focused, ⌘1..⌘6 / ⌘0 act as heading/paragraph formatting; press Esc to leave the block and restore global view switching."
    jsonformat: "JSON formatter: paste raw JSON to format instantly; collapsible tree, array compaction preview, copy node values."
  group_global: "Global"
  group_rail: "View switching"
  group_editor: "Markdown / Notes editor"
  group_cat_file: "File"
  group_cat_edit: "Edit"
  group_cat_navigation: "Navigation"
  group_cat_markdown: "Markdown formatting"
  group_cat_block: "Block operations"
  group_cat_other: "Other"
