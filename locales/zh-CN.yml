help:
  title: 帮助中心
  open_hint: 帮助中心
  search_ph: 搜索功能或快捷键…
  nav_start: 快速上手
  nav_features: 功能导览
  nav_shortcuts: 快捷键
  nav_about: 关于
  search_results: 搜索结果
  no_results: 没有匹配的内容，换个关键词试试
  start_t1: Verve 是什么
  start_p1: Verve 是离线优先的开发者工作台，把 API 调试、SSH 运维、Markdown 与笔记、JSON 格式化、压测、抓包等日常工具集成到一个应用。所有数据保存在本地 ~/.verve 目录，无需账号，不依赖云端。
  start_t2: 视图切换
  start_p2: 左侧功能栏可点击切换或拖拽排序，常用视图有固定快捷键：⌘1 API 管理、⌘2 SSH 管理、⌘3 JSON 格式化、⌘4 记事本、⌘5 Markdown 编辑器（Windows/Linux 为 Ctrl+1..5）。在 Markdown / 记事本的编辑块内，这些数字键优先用作标题/正文格式，按 Esc 退出块焦点后即可恢复视图切换。
  start_t3: 编辑器
  start_p3: 记事本与 Markdown 编辑器共用同一 WYSIWYG 引擎：直接在渲染后的文档上编辑，支持标题、列表、表格、代码块、图片等，也可切换源码模式。完整按键见「快捷键」一节。
  start_t4: 环境变量
  start_p4: 在请求的 URL、Header、Body 中用 {{变量名}} 占位符引用环境变量 / 全局变量；顶栏切换环境，设置 → 环境管理中维护变量，重命名变量时占位符会自动同步。
  start_t5: 数据与同步
  start_p5: 工作区数据以本地 git 仓库自动保存（间隔可在设置中调整），支持历史回溯。
  start_t6: 自定义
  start_p6: 左下角 ⚙ 打开设置：界面语言、主题、首页视图、隐藏菜单项、编辑器快捷键自定义等。
  view_desc_intro: 应用内的每个功能视图（对应左侧功能栏）：
  view_desc:
    api: API 管理与调试：项目 / 文件夹 / 请求树，构建请求（参数、Header、Body、认证），查看响应与历史示例，cURL 导入导出，环境变量替换。
    history: 按时间线查看请求历史与响应，可回溯重发。
    mock: Mock 服务：为接口配置 Mock 规则并本地起服，方便前端联调。
    projectmanage: 项目管理：Git 状态、暂存与提交、历史与分支管理（gix 后端）。
    share: 文档管理：把本地文档发布为在线分享链接，管理与查看分享配置。
    autotest: 自动化测试：编排测试套件 / 用例 / 步骤，一键运行并查看报告。
    stress: 压力测试：图形化配置并发、时长等参数发起压测，实时查看结果曲线。
    proxy: HTTP 抓包：本地代理捕获请求流量，查看与调试接口。
    k8s: Kubernetes 管理：集群资源浏览、Pod 日志与终端。
    docker: Docker 管理：容器 / 镜像列表、日志、终端与常用操作。
    ssh: SSH 管理：主机卡片管理连接信息，多标签终端会话，SFTP 文件浏览与传输。
    hosts: Hosts 快速编辑器：多配置组管理 hosts 条目，一键应用到系统 /etc/hosts 或应用内虚拟覆盖。
    notes: 记事本：轻量 Markdown 笔记（WYSIWYG 编辑），自动保存、搜索与笔记树管理。编辑块聚焦时 ⌘1..⌘6 / ⌘0 用作标题与正文格式，按 Esc 退出块焦点后恢复全局视图切换。
    markdowneditor: Markdown 编辑器：多标签打开 .md 文件，所见即所得编辑、源码模式、查找替换、导出 PDF。编辑块聚焦时 ⌘1..⌘6 / ⌘0 用作标题与正文格式，按 Esc 退出块焦点后恢复全局视图切换。
    jsonformat: JSON 格式化：粘贴原始 JSON 即时格式化，可折叠树浏览、数组精简预览、复制节点值。
  group_global: 全局
  group_rail: 视图切换
  group_editor: Markdown / 记事本编辑器
  group_cat_file: 文件
  group_cat_edit: 编辑
  group_cat_navigation: 导航
  group_cat_markdown: Markdown 格式
  group_cat_block: 块操作
  group_cat_other: 其他
  sc_g_help: 打开帮助中心
  sc_g_send: 发送请求（API 视图）
