# ---- Cloud docs (Pioneer) -------------------------------------------------
clouddocs:
  crumb: "Cloud docs & collaboration"
  title: "Cloud docs & collaboration"
  intro: "Host your API docs in the cloud via a self-hosted verve-server and share them with your team and external developers through public or password-protected links — managed online without the desktop app."
  s1_title: "Standalone server mode"
  s1_desc: "verve-server is a standalone binary service — no desktop app, binds 0.0.0.0 with a file-backed store, self-hosted on your own server."
  s1_b1: "Single binary, zero GUI deps, builds with just the Rust toolchain"
  s1_b2: "One-command Docker deploy with persistent volume storage"
  s1_b3: "Custom port, host, and data directory"
  s1_b4: "All data stays local — fully under your control"
  s2_title: "Cloud document sharing"
  s2_desc: "Push a project from the desktop app to a remote verve-server to get a public /s/<id> link — front-end/client devs can browse without installing anything."
  s2_b1: "Push a project to the remote server, get a public share link"
  s2_b2: "Expiration + password access control"
  s2_b3: "9 field-level display toggles to control what's visible"
  s3_title: "Team collaboration"
  s3_desc: "Host API docs in the cloud so teammates and external collaborators access one canonical link; CI pipelines can also upload the latest docs."
  s3_b1: "Teamwork: members access a single canonical doc via link"
  s3_b2: "External publishing: generate public/password-protected doc links"
  s3_b3: "Continuous delivery: CI uploads the latest project JSON so docs stay in sync with code"
  s4_title: "Admin Web UI"
  s4_desc: "verve-server ships with a /admin Web UI — upload, create, browse and delete shares online without the desktop app, with multi-tenant support."
  s4_b1: "Upload a project: paste a Verve-exported Project JSON"
  s4_b2: "Create a share: pick project, title, public/password"
  s4_b3: "Browse / delete share links, multi-tenant management"
  note_label: "Note:"
  note: "Document sharing produces a read-only snapshot of the project at upload time — real-time collaborative editing or live sync of shared docs is not supported. Git-based cross-machine workspace sync is available in both editions."
  deploy_cta: "Need the full deployment steps (Docker / binary / config)?"
  deploy_link: "View the verve-server deployment guide"
  source: "View source on GitHub"

