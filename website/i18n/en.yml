# ---- Capability pillars -------------------------------------------------
pillars:
  title: "Nine pillars, one window"
  api: "API & Testing"
  api_d: "Full HTTP debugging, gRPC-Web, TCP, SSE, WebSocket, Socket.IO, multi-environment variables, pre-request & test scripts."
  terminal: "Terminal & Triage"
  terminal_d: "SSH terminal, SFTP, Zmodem, port forwarding, Docker & Kubernetes log inspection and exec."
  testing: "Stress & Automation"
  testing_d: "Native stress-test engine with live p50/p90/p95/p99 charts; suite/case/step automated testing with assertions & extractors."
  mock: "Mock & Capture"
  mock_d: "HTTP capture proxy and a local mock server with Exact→Prefix→Regex matching."
  docs: "Docs & Git"
  docs_d: "Document sharing and Git-based cross-machine sync — each workspace is a branch."
  notes: "Notes"
  notes_d: "Markdown block editor, notes tree (folders/pin/tags), live-preview canvas, export to PDF."
  mdeditor: "Markdown Editor"
  mdeditor_d: "Standalone .md file editor (multi-tab, Finder double-click / verve file.md), replaces MarkText."
  hosts: "Hosts"
  hosts_d: "Manage hosts profiles without touching system files."
  json: "JSON"
  json_d: "Collapsible JSON formatter, tree navigation, instant validation."

# ---- Detailed feature copy (features page) -------------------------------
features:
  knowledge_title: "Knowledge & docs"
  testing_title: "Testing & cloud"
  cluster_title: "Containers & clusters"
  server_triage_note: "Scoped to the daily triage workflow — inspect, tail logs, exec into running targets. Not a full cluster lifecycle manager."
  ssh_d: "A real terminal for servers, with the protocols and safety you expect from a dedicated SSH client."
  docker_d: "Containers and images at a glance — stream logs, drop into a shell, drive a remote daemon."
  k8s_d: "Inspect pods and namespaces, tail logs, exec and port-forward — without leaving the app."
  sftp_d: "Browse and transfer files over your authenticated SSH session, with Zmodem in the terminal."
  md_d: "Write notes and edit Markdown files — a block editor, a notes tree, and PDF export in one place."

