  s1_b1: "独立二进制，零 GUI 依赖，仅需 Rust 工具链编译"
  s1_b2: "Docker 一键部署，数据持久化到卷"
  s1_b3: "自定义端口、主机与数据目录"
  s1_b4: "全数据本地留存，你可完全掌控"
  s2_title: "云端文档分享"
  s2_desc: "从桌面端把项目推送到远程 verve-server，获取公网 /s/<id> 链接，前端/客户端开发者无需安装即可浏览。"
  s2_b1: "推送项目到远程 server，生成公网分享链接"
  s2_b2: "支持有效期 + 密码访问控制"
